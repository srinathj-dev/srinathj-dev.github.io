<!doctype html>
<html lang = "en">
  <head>
    <meta charset = "UTF-8" />
    <meta name = "viewport" content = "width = device-width, initial-scale = 1.0" />
    <title>kanBanBoard</title>
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<script src = "https://kit.fontawesome.com/cc2553a343.js" crossorigin = "anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  </head>
  <body class = "w-screen h-screen flex justify-center bg-[#f9f9fb] relative">
    <div id = "mainContainer" class = "w-11/12 h-full  backdrop-blur flex flex-col">
      <div class = "headingContainer w-full flex justify-center p-4">
        <div class="w-5/6">
        <h1 class = " text-4xl font-[Manrope] leading-[40px] text-slate-800 font-bold">KanBan Board</h1>
          <p class = "text-xl leading-[28px] font-normal font-[Inter] ">Focus on the flow, not the finish line. </p>
        </div>
      </div>
      <div id = "columnsContainer" class = "flex flex-col items-start justify-between md:flex-row w-full p-4 gap-6 md:gap-4">
        
        <div id = "toDoContainer" class = " md:w-3/12 bg-[#f3f4f6] backdrop-blur border-[1px] border-white rounded-lg ">
          <div id = "toDoHeader" class = "border-t-4 border-[#d8d3e5] backdrop-blur text-center p-4 rounded-t-lg flex justify-between items-center ">
            <div class="flex items-center gap-2">
              <p class="w-[10px] h-[10px] rounded-full  bg-[#d8d3e5] "></p>
              <h2 class = "font-medium font-[Inter, sans-serif] text-[#2E3336] text-base">To Do</h2>
              <div class="w-[23px] h-[23px] rounded-full  bg-[#edeef1] flex flex-col justify-center   text-center text-[12px] font-semibold"><p>0</p></div>
            </div>
            <div>
        		  <button class = "addTask flex items-center justify-center text-yellow-50 border-[1px] border-slate-100 bg-slate-900/40 backdrop-blur rounded-sm w-4 h-4" ><i class = "fa-solid fa-plus text-xs"></i></button>
            </div>
          </div>
					<div id = "toDoBody" class = " overflow-y-scroll p-4" >
            <button class = "addTask flex items-center justify-center border-2 border-dashed border-slate-400/30 rounded-md w-full p-5 h-5 gap-2 mt-4 font-[Manrope] text-[#5B6063] text-sm font-semibold cursor-pointer hover:bg-slate-400/30 duration-300 " ><i class = "fa-solid fa-plus"></i>Add Task </button>
          </div>
        </div>
        <div id = "progressContainer" class = "  md:w-3/12 bg-[#f3f4f6] backdrop-blur border-[1px] border-white rounded-lg ">
          <div id = "inProgressHeader" class = "border-t-4 border-[#cad9cf] backdrop-blur text-center p-4 rounded-t-lg flex justify-between items-center">
            <div class="flex items-center gap-2">
              <p class="w-[10px] h-[10px] rounded-full  bg-[#286C3466]  "></p>
              <h2 class = "font-medium font-[Inter, sans-serif] text-[#2E3336] text-base">In Progress</h2>
              <div class="w-[23px] h-[23px] rounded-full  bg-[#edeef1] flex flex-col justify-center   text-center text-[12px] font-semibold"><p>0</p></div>
            </div>
            <div>
						  <button class = "addTask flex items-center justify-center text-yellow-50 border-[1px] border-slate-100 bg-slate-900/40 backdrop-blur rounded-sm w-4 h-4" ><i class = "fa-solid fa-plus text-xs"></i></button>
            </div>
          </div>
					<div id = "progressBody" class = "  overflow-y-scroll p-4">
            <button class = "addTask flex items-center justify-center border-2 border-dashed border-slate-400/30 rounded-md w-full p-5 h-5 gap-2 mt-4 font-[Manrope] text-[#5B6063] text-sm font-semibold cursor-pointer hover:bg-slate-400/30 duration-300 " ><i class = "fa-solid fa-plus"></i>Add Task </button>
          </div>
        </div>
        <div id = "reviewContainer" class = "md:w-3/12  bg-[#f3f4f6] backdrop-blur border-[1px] border-white rounded-lg">
          <div id = "reviewHeader" class = "border-t-4 border-[#dad4d3] backdrop-blur text-center p-4 rounded-t-lg flex justify-between items-center">
            <div class="flex items-center gap-2">
              <p class="w-[10px] h-[10px] rounded-full  bg-[#7C564966]  "></p>
              <h2 class = "font-medium font-[Inter, sans-serif] text-[#2E3336] text-base">Review</h2>
              <div class="w-[23px] h-[23px] rounded-full  bg-[#edeef1] flex flex-col justify-center   text-center text-[12px] font-semibold"><p>0</p></div>
            </div>
            <div>
						  <button class = "addTask flex items-center justify-center text-yellow-50 border-[1px] border-slate-100 bg-slate-900/40 backdrop-blur rounded-sm w-4 h-4" ><i class = "fa-solid fa-plus text-xs"></i></button>
            </div>
						
          </div>
					<div id = "reviewBody" class = " overflow-y-scroll p-4">
            <button class = "addTask flex items-center justify-center border-2 border-dashed border-slate-400/30 rounded-md w-full p-5 h-5 gap-2 mt-4 font-[Manrope] text-[#5B6063] text-sm font-semibold cursor-pointer hover:bg-slate-400/30 duration-300 " ><i class = "fa-solid fa-plus"></i>Add Task </button>
          </div>
        </div>
        <div id = "doneContainer" class = " md:w-3/12 bg-[#f3f4f6] backdrop-blur border-[1px] border-white rounded-lg">
          <div id = "doneHeader" class = "border-t-4 border-[#c0dbfe] backdrop-blur text-center p-4 rounded-t-lg flex justify-between items-center">
            <div class="flex items-center gap-2">
              <p class="w-[10px] h-[10px] rounded-full  bg-[#93C5FD]"></p>
              <h2 class = "font-medium font-[Inter, sans-serif] text-[#2E3336] text-base">Done</h2>
              <div class="w-[23px] h-[23px] rounded-full  bg-[#edeef1] flex flex-col justify-center   text-center text-[12px] font-semibold"><p>1</p></div>
            </div>
            <div>
						  <button class = "addTask flex items-center justify-center text-yellow-50 border-[1px] border-slate-100 bg-slate-900/40 backdrop-blur rounded-sm w-4 h-4" ><i class = "fa-solid fa-plus text-xs"></i></button>
            </div>
          </div>
					<div id = "doneBody" class = "overflow-y-scroll p-4 ">
            <div class = " w-full bg-white p-4  flex flex-col gap-2 rounded-xl border-[1px] border-slate-50">
              <div class = "w-full cardHeader flex items-center justify-between gap-1">
                <div class = "flex gap-2 items-center">
                  <div class = "progressMeterContainer rounded-full flex flex-wrap w-5 h-5 border-[1px] border-slate-50 ">
                    <div class = "w-3 h-3 rounded-full" style="background: conic-gradient(#93C5FD 75%, transparent 0);"></div>
                  </div>
                  <div><h3 class="text-base  leading-[20px] font-medium font-[Inter, sans-serif] text-slate-800"> Moodboard: "Mindful Curator"</h3></div>
                </div> 
                <div class = "border-[1px] border-slate-600 w-3 h-3 flex flex-col justify-center rounded-lg">
                  <button class="text-[8px] text-slate-600"><i class="fa fa-x" ></i></button>
                </div>
              </div>
              <div class="w-full flex justify-start font-[Inter, sans-serif] text-[#7c8083]  text-sm font-normal leading-[20px] "><p>Project description</p></div>
            </div>
            <button class = "addTask flex items-center justify-center border-2 border-dashed border-slate-400/30 rounded-md w-full p-5 h-5 gap-2 mt-4 font-[Manrope] text-[#5B6063] text-sm font-semibold cursor-pointer hover:bg-slate-400/30 duration-300 " ><i class = "fa-solid fa-plus"></i>Add Task </button>
          </div>
        </div>
      </div>
    </div>
