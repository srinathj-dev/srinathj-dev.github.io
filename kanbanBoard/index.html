<!doctype html>
<html lang = "en">

<head>
  <meta charset = "UTF-8" />
  <meta name = "viewport" content = "width  =  device-width, initial-scale  =  1.0" />
  <title>kanBanBoard</title>
  <script src = "https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src = "https://kit.fontawesome.com/cc2553a343.js" crossorigin = "anonymous"></script>
  <link rel = "preconnect" href = "https://fonts.googleapis.com">
  <link rel = "preconnect" href = "https://fonts.gstatic.com" crossorigin>
  <link href = "https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  <link
    href = "https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel = "stylesheet">
</head>

<body class = "w-screen h-dvh box-border  bg-[#f9f9fb] relative  overflow-y-scroll ">

  <nav class = "headingContainer w-full max-h-fit z-10 bg-slate-100/50 backdrop-blur sticky top-0 flex justify-center p-4">
    <div class = "w-5/6">
      <h1 class = " text-4xl font-[Manrope] leading-[40px] text-slate-800 font-bold">KanBan Board</h1>
      <p class = "text-xl leading-[28px] font-normal font-[Inter] ">Focus on the flow, not the finish line. </p>
    </div>
  </nav>

  <div class = "w-full h-dvh flex  flex-col items-center   flex-basis box-border">
    <div id = "columnsContainer" class = " w-11/12 h-5/6 flex  items-start justify-between overflow-hidden p-2 gap-6 md:gap-4">

      <div id = "toDoContainer" class = "taskColumn max-h-full md:w-3/12 flex flex-col bg-[#f3f4f6] backdrop-blur border-[1px] border-white rounded-lg ">
        <div id = "toDoHeader" class = "border-t-4 border-[#d8d3e5] backdrop-blur text-center p-4 rounded-t-lg flex justify-between items-center ">
          <div class = "flex items-center gap-2">
            <p class = "w-[10px] h-[10px] rounded-full  bg-[#d8d3e5] "></p>
            <h2 class = "font-medium font-[Inter, sans-serif] text-[#2E3336] text-base">To Do</h2>
            <div class = "w-[23px] h-[23px] rounded-full  bg-[#edeef1] flex flex-col justify-center   text-center text-[12px] font-semibold">
              <p id ="toDoCount"></p>
            </div>
          </div>
          <div>
            <button class = "addTask flex items-center justify-center text-yellow-50 border-[1px] border-slate-50 bg-[#d8d3e5] backdrop-blur rounded-sm w-4 h-4 cursor-pointer">
              <i class = "fa-solid fa-plus text-sm"></i></button>
          </div>
        </div>
        <div id = "toDoTasks" class = "flex flex-col overflow-y-auto flex-1 p-4 ">
          <div id = "toDoTasksList" class = "flex flex-col overflow-y-auto gap-2">

          </div>
          <button
            class = "addTask flex items-center justify-center border-2 border-dashed border-slate-400/30 rounded-md w-full p-5 h-5 gap-2 mt-4 font-[Manrope] text-[#5B6063] text-sm font-semibold cursor-pointer hover:bg-slate-400/30 duration-300 "><i
              class = "fa-solid fa-plus"></i>Add Task </button>
        </div>
      </div>
      <div id = "progressContainer" class = "taskColumn max-h-full md:w-3/12 flex flex-col bg-[#f3f4f6] backdrop-blur border-[1px] border-white rounded-lg ">
        <div id = "inProgressHeader" class = "border-t-4 border-[#cad9cf] backdrop-blur text-center p-4 rounded-t-lg flex justify-between items-center">
          <div class = "flex items-center gap-2">
            <p class = "w-[10px] h-[10px] rounded-full  bg-[#286C3466]  "></p>
            <h2 class = "font-medium font-[Inter, sans-serif] text-[#2E3336] text-base">In Progress</h2>
            <div class = "w-[23px] h-[23px] rounded-full  bg-[#edeef1] flex flex-col justify-center   text-center text-[12px] font-semibold">
              <p id = "progressCount"></p>
            </div>
          </div>
          <div>
            <button class = "addTask flex items-center justify-center text-yellow-50 border-[1px] border-slate-100 bg-[#cad9cf] backdrop-blur rounded-sm w-4 h-4 cursor-pointer">
              <i class = "fa-solid fa-plus text-xs"></i></button>
          </div>
        </div>
        <div id = "progressTasks" class = " flex flex-col overflow-y-auto flex-1 p-4 ">
          <div id = "progressTasksList" class = "flex flex-col overflow-y-auto gap-2">
            
          </div>
          <button class = "addTask flex items-center justify-center border-2 border-dashed border-slate-400/30 rounded-md w-full p-5 h-5 gap-2 mt-4 font-[Manrope] text-[#5B6063] text-sm font-semibold cursor-pointer hover:bg-slate-400/30 duration-300 ">
            <i class = "fa-solid fa-plus"></i>Add Task </button>
        </div>
      </div>
      <div id = "reviewContainer" class = "taskColumn max-h-full md:w-3/12  flex flex-col bg-[#f3f4f6] backdrop-blur border-[1px] border-white rounded-lg">
        <div id = "reviewHeader" class = "border-t-4 border-[#dad4d3] backdrop-blur text-center p-4 rounded-t-lg flex justify-between items-center">
          <div class = "flex items-center gap-2">
            <p class = "w-[10px] h-[10px] rounded-full  bg-[#7C564966]  "></p>
            <h2 class = "font-medium font-[Inter, sans-serif] text-[#2E3336] text-base">Review</h2>
            <div class = "w-[23px] h-[23px] rounded-full  bg-[#edeef1] flex flex-col justify-center   text-center text-[12px] font-semibold">
              <p id="reviewCount"></p>
            </div>
          </div>
          <div>
            <button class = "addTask flex items-center justify-center text-yellow-50 border-[1px] border-slate-100 bg-[#dad4d3] backdrop-blur rounded-sm w-4 h-4 cursor-pointer">
              <i class = "fa-solid fa-plus text-xs"></i>
            </button>
          </div>

        </div>
        <div id = "reviewTasks" class = "flex flex-col overflow-y-auto flex-1 p-4">
          <div id = "reviewTasksList" class = "flex flex-col overflow-y-auto gap-2">

          </div>
          <button class = "addTask flex items-center justify-center border-2 border-dashed border-slate-400/30 rounded-md w-full p-5 h-5 gap-2 mt-4 font-[Manrope] text-[#5B6063] text-sm font-semibold cursor-pointer hover:bg-slate-400/30 duration-300 ">
            <i class = "fa-solid fa-plus"></i>Add Task </button>
        </div>
      </div>
      <div id = "doneContainer" class = "taskColumn max-h-full md:w-3/12 flex flex-col bg-[#f3f4f6] backdrop-blur border-[1px] border-white rounded-lg">
        <div id = "doneHeader" class = "border-t-4 border-[#c0dbfe] backdrop-blur text-center p-4 rounded-t-lg flex justify-between items-center">
          <div class = "flex items-center gap-2">
            <p class = "w-[10px] h-[10px] rounded-full  bg-[#93C5FD]"></p>
            <h2 class = "font-medium font-[Inter, sans-serif] text-[#2E3336] text-base">Done</h2>
            <div class = "w-[23px] h-[23px] rounded-full  bg-[#edeef1] flex flex-col justify-center   text-center text-[12px] font-semibold">
              <p id = "doneCount"></p>
            </div>
          </div>
          <div>
            <button class = "addTask flex items-center justify-center text-yellow-50 border-[1px] border-slate-100 bg-[#c0dbfe] backdrop-blur rounded-sm w-4 h-4 cursor-pointer">
              <i class = "fa-solid fa-plus text-xs"></i></button>
          </div>
        </div>
        <div id = "doneTasks" class = "flex flex-col flex-1 overflow-y-auto p-4 ">
          <div id = "doneTasksList" class = "flex flex-col overflow-y-auto gap-2">

          </div>
          <button class = "addTask flex items-center justify-center border-2 border-dashed border-slate-400/30 rounded-md w-full p-5 h-5 gap-2 mt-4 font-[Manrope] text-[#5B6063] text-sm font-semibold cursor-pointer hover:bg-slate-400/30 duration-300 "><i
              class = "fa-solid fa-plus"></i>Add Task </button>
        </div>
      </div>
    </div>
    
  </div>
  <div class = "headingContainer w-full h-[12%]  flex justify-center p-4">
    <div class = "w-5/6">
      <h1 class = " text-4xl font-[Manrope] leading-[40px] text-slate-800 font-bold">KanBan Board</h1>
      <p class = "text-xl leading-[28px] font-normal font-[Inter] ">Focus on the flow, not the finish line. </p>
    </div>
  </div>
  <div class = "headingContainer w-full h-[12%]  flex justify-center p-4">
    <div class = "w-5/6">
      <h1 class = " text-4xl font-[Manrope] leading-[40px] text-slate-800 font-bold">KanBan Board</h1>
      <p class = "text-xl leading-[28px] font-normal font-[Inter] ">Focus on the flow, not the finish line. </p>
    </div>
  </div>
  <div class = "headingContainer w-full h-[12%]  flex justify-center p-4">
    <div class = "w-5/6">
      <h1 class = " text-4xl font-[Manrope] leading-[40px] text-slate-800 font-bold">KanBan Board</h1>
      <p class = "text-xl leading-[28px] font-normal font-[Inter] ">Focus on the flow, not the finish line. </p>
    </div>
  </div>
  <div id="addTaskOverlay" class = " absolute inset-0 flex flex-col justify-center items-center bg-slate-100/10 backdrop-blur w-full h-full px-8  gap-2 z-20 hidden">
    <div id="overlayMainContainer" class = "w-4/6 h-5/6 bg-[#0F172A] border-2 border-indigo-200 flex flex-col">
      <div class="w-full p-2 bg-slate-100/10"><h2 class="text-slate-200">Add Task</h2></div>
      <div class = "w-full flex flex-col p-6 gap-1"><p class="text-slate-300">enter-heading</p><input id = "headingInput" class = " border-[1px] border-slate-600 p-1 w-full text-white " type = "text" placeholder = "enter-heading"></div>
      <div class = "w-full h-full flex flex-col p-6 gap-1 ">
        <p class="text-slate-300">enter-description</p>
        <textarea id="descriptionInput" class = "w-full h-full  p-2 text-slate-50 border-[1px] border-slate-600" type = "text" placeholder = "enter-description"></textarea>
      </div>
      <div class="w-full py-4 bg-slate-100/10 flex justify-between p-4 px-6">
        <button id = "closeOverlay" class = "w-32 px-2 py-1 bg-slate-100 cursor-pointer">cancel</button>
        <button id = "addTaskValues" class="w-32 px-2 py-1  bg-[#5ea5fa] text-slate-100 cursor-pointer">add</button>
      </div>
    </div>
  </div>
  
  <script src = "index.js">
  </script>
</body>

</html>
