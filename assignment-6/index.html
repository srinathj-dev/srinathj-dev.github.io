<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToDoListManager</title>
  <script src="https://kit.fontawesome.com/cc2553a343.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cherry+Cream+Soda&display=swap" rel="stylesheet">
  
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body>
  <div class="mainContainer">
    <div class="mainHeading">
      <h1>Accordian & Dropdown</h1>
    </div>
    <div class="taskContainer" id="taskContainer">
      <div class="accordianContainer">
        <div class="accordian">
          <div class="accordianHeading">
            <h1 class="accordianH">What is the First Assignment?</h1>
          </div>
          <div class="accordianBodyContainer">
            <div class="editContainer">
              <div class="textContainer">
                <p class="accordianBody" >portfolio Website</p>
              </div>
              <div class="dropdown">
                <div class="select">fontStyle
                  <span class="selected">
                    <i class="fa-solid fa-angle-down"></i>
                  </span>
                </div>
                <ul class="menu">
                  <li class="fontStyle1">Roboto</li>
                  <li class="fontStyle2">Soda</li>
                </ul>
              </div>
            </div>
          </div>
        </div>
        <div class="accordian">
          <div class="accordianHeading">
            <h1 class="accordianH">What is the Second Assignment?</h1>
          </div>
          <div class="accordianBodyContainer">
            <div class="editContainer">
              <div class="textContainer">
                <p class="accordianBody" >pets Website</p>
              </div>
              <div class="dropdown">
                <div class="select">fontStyle
                  <span class="selected">
                    <i class="fa-solid fa-angle-down"></i>
                  </span>
                </div>
                <ul class="menu">
                  <li class="fontStyle1">Roboto</li>
                  <li class="fontStyle2">Soda</li>
                </ul>
              </div>
            </div>
          </div>
        </div>
        <div class="accordian">
          <div class="accordianHeading">
            <h1 class="accordianH">What is the third Assignment?</h1>
          </div>
          <div class="accordianBodyContainer">
            
            <div class="editContainer">
              <div class="textContainer">
                <p class="accordianBody">profile card controller</p>
              </div>

              <div class="dropdown">
                <div class="select">fontStyle
                  <span class="selected">
                    <i class="fa-solid fa-angle-down"></i>
                  </span>
                </div>
                <ul class="menu">
                  <li class="fontStyle1">Roboto</li>
                  <li class="fontStyle2">Soda</li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
   const accordianHeadingContainers = document.querySelectorAll(".accordianHeading");
   const dropdowns =document.querySelectorAll(".dropdown");
     
    document.addEventListener("click", function(event){

      const clickedAccordionHeader = event.target.closest(".accordianHeading");
      const editContainer = event.target.closest(".editContainer");
      const dropdowns =event.target.closest(".dropdown");
      const style1 = event.target.closest(".fontStyle1");
      const style2 = event.target.closest(".fontStyle2");

      function hideAllAcordions(h){
      h.classList.remove("active");
      h.nextElementSibling.style.display = "none";
      }

      function displaySelectedAcordionBody(){
        clickedAccordionHeader.classList.add("active");
        clickedAccordionHeader.nextElementSibling.style.display = "block";
      }

      function hideSelectedAcordionBody(){
        clickedAccordionHeader.classList.remove("active");
        clickedAccordionHeader.nextElementSibling.style.display = "none";
      }

      if(clickedAccordionHeader){
        const isActive = clickedAccordionHeader.classList.contains("active");

        accordianHeadingContainers.forEach( hideAllAcordions ) ;
          
        if( isActive == false){

          displaySelectedAcordionBody();

        }else{

          hideSelectedAcordionBody();

        }
        event.stopPropagation();

      }else if(editContainer){

        event.stopPropagation();

      }else{
        accordianHeadingContainers.forEach( hideAllAcordions );
      }

      if(dropdowns){
        const selectIcon = dropdowns.querySelector(".selected");
        const menuList = dropdowns.querySelector(".menu");
        selectIcon.classList.toggle("activeDD");
        menuList.classList.toggle("menuDisplay");

        event.stopPropagation();
      }

      if(style1){
        
        const parent = style1.closest(".editContainer");

        parent.querySelector(".fontStyle2").classList.remove("menuSelect");
        style1.classList.add("menuSelect");
         let text= parent.querySelector(".accordianBody")
        text.style.fontFamily ="'Roboto', sans-serif";


      } 
      if(style2){
        
        const parent = style2.closest(".editContainer")
        parent.querySelector(".fontStyle1").classList.remove("menuSelect");
        style2.classList.add("menuSelect");
        let text= parent.querySelector(".accordianBody")
        text.style.fontFamily ="'Cherry Cream Soda', system-ui";
      }
    });

  </script>
</body>

</html>
