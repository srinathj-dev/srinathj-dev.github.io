<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToDoListManager</title>
  <script src="https://kit.fontawesome.com/cc2553a343.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cherry+Cream+Soda&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />

</head>

<body>
  <div class="mainContainer">
    <div class="mainHeading">
      <h1>Accordian & Dropdown</h1>
    </div>
    <div class="taskContainer" id="taskContainer">
      <div class="accordianContainer">
        <div class="accordian">
          <div class="accordianHeading">
            <h1 class="accordianH">Accordian1</h1>
          </div>
          <div class="accordianBodyContainer">
            <div class="editContainer">
              <div class="textContainer">
                <p class="accordianBody">Hello</p>
              </div>
              <div class="dropdown">
                <div class="select">
                  <span class="selected">
                    <i class="fa-solid fa-angle-down"></i>
                  </span>
                </div>
                <ul class="menu">
                  <li><i class="fa-regular fa-pen-to-square"></i>Edit</li>
                  <li><i class="fa-solid fa-floppy-disk"></i>Save</li>
                </ul>
              </div>
            </div>
          </div>
        </div>
        <div class="accordian">
          <div class="accordianHeading">
            <h1 class="accordianH">Accordian2</h1>
          </div>
          <div class="accordianBodyContainer">
            <div class="editContainer">
              <div class="textContainer">
                <p class="accordianBody">World!</p>
              </div>
              <div class="dropdown">
                <div class="select">
                  <span class="selected">
                    <i class="fa-solid fa-angle-down"></i>
                  </span>
                </div>
                <ul class="menu">
                  <li><i class="fa-regular fa-pen-to-square"></i>Edit</li>
                  <li><i class="fa-solid fa-floppy-disk"></i>Save</li>
                </ul>
              </div>
            </div>
          </div>
        </div>
        <div class="accordian">
          <div class="accordianHeading">
            <h1 class="accordianH">Accordian3</h1>
          </div>
          <div class="accordianBodyContainer">
            
            <div class="editContainer">
              <div class="textContainer">
                <p class="accordianBody">Welcome</p>
              </div>

              <div class="dropdown">
                <div class="select">
                  <span class="selected">
                    <i class="fa-solid fa-angle-down"></i>
                  </span>
                </div>
                <ul class="menu">
                  <li><i class="fa-regular fa-pen-to-square"></i>Edit</li>
                  <li><i class="fa-solid fa-floppy-disk"></i>Save</li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
   const accordianContH =document.querySelectorAll(".accordianHeading");
     
    document.addEventListener("click", event =>{

      let clickedHead = event.target.closest(".accordianHeading");
        console.log(clickedHead);
      if(clickedHead){
        const isActive = clickedHead.classList.contains("active");

        accordianContH.forEach(h => {
          h.classList.remove("active");
          h.nextElementSibling.style.display = "none";
        });
          
        if( isActive == false){

          clickedHead.classList.add("active");
          clickedHead.nextElementSibling.style.display = "block";

        }else{

          clickedHead.classList.remove("active");
          clickedHead.nextElementSibling.style.display = "none";

        }
        event.stopPropagation();
      }else{
          accordianContH.forEach(h => {
          h.classList.remove("active");
          h.nextElementSibling.style.display = "none";
        });
        }
    });
  
    const accordianContB =document.querySelectorAll(".dropdown"); 
    accordianContB.forEach( function (accordianBody){
      accordianBody.addEventListener("click", event => {

        const selectIcon = accordianBody.querySelector(".selected");
        const menuList = accordianBody.querySelector(".menu");

        selectIcon.classList.toggle("activeDD");
        menuList.classList.toggle("menuDisplay");

        event.stopPropagation();

      });
    })
  </script>
</body>

</html>
